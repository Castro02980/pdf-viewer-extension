<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #b3261e;
      color: #fff;
    }
    .header img { width: 28px; height: 28px; }
    .header .title { font-size: 15px; font-weight: 600; }
    .header .version { margin-left: auto; font-size: 11px; opacity: .85; }
    .body { padding: 18px 16px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #0a7d33;
      background: #eafaf0;
      border: 1px solid #b7e4c7;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #17a44b;
      flex-shrink: 0;
    }
    .msg { font-size: 13px; line-height: 1.5; color: #333; }
    .msg b { color: #111; }
    .foot {
      padding: 10px 16px 14px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="PDF Viewer">
    <span class="title">PDF Viewer</span>
    <span class="version">v1.0.2</span>
  </div>
  <div class="body">
    <div class="status">
      <span class="dot"></span>
      <span>Extension is active and running</span>
    </div>
    <p class="msg">
      The PDF Viewer extension is working correctly and is able to read PDF documents without errors.
    </p>
  </div>
  <div class="foot">
    PDF Viewer — built-in document reader
  </div>
</body>
</html>
