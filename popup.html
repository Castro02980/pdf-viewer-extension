<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PDF Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 500px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .upload-area:hover {
      border-color: #4CAF50;
      background: #f9f9f9;
    }
    
    .upload-area.dragover {
      border-color: #4CAF50;
      background: #e8f5e9;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    .upload-text {
      color: #666;
      font-size: 14px;
    }
    
    .upload-text strong {
      color: #4CAF50;
    }
    
    #viewer-container {
      margin-top: 20px;
      display: none;
    }
    
    #pdf-info {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #666;
    }
    
    #pdf-info strong {
      color: #333;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }
    
    button:hover {
      background: #45a049;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    #page-info {
      padding: 8px;
      background: white;
      border-radius: 4px;
      font-size: 14px;
    }
    
    #pdf-canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 100%;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>
    <span>📄</span>
    PDF Viewer
  </h1>
  
  <div class="upload-area" id="uploadArea">
    <div class="upload-icon">📁</div>
    <div class="upload-text">
      <strong>Click to select</strong> or drag & drop a PDF file here
    </div>
    <input type="file" id="pdfFile" accept="application/pdf,.pdf">
  </div>
  
  <div id="viewer-container">
    <div id="pdf-info"></div>
    
    <div class="controls">
      <button id="prevPage">← Previous</button>
      <div id="page-info">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></div>
      <button id="nextPage">Next →</button>
    </div>
    
    <canvas id="pdf-canvas"></canvas>
  </div>
  
  <div id="error" class="error" style="display: none;"></div>
  
  <script src="pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
